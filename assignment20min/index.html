<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard</title>
  <link rel="stylesheet" href="css.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">⊞</span>
      <span class="brand-title">My Dashboard</span>
    </div>
    
<aside class="sidebar">
  <nav class="nav-list">
    <a href="#" class="nav-item active">
      <span class="nav-icon"></span>
      <span>Dashboard</span>
    </a>

    <a href="#" class="nav-item">
      <span class="nav-icon"></span>
      <span>Users</span>
    </a>

    <a href="#" class="nav-item">
      <span class="nav-icon"></span>
      <span>Sales</span>
    </a>

    <a href="#" class="nav-item">
      <span class="nav-icon"></span>
      <span>Orders</span>
    </a>

    <a href="#" class="nav-item">
      <span class="nav-icon"></span>
      <span>Reports</span>
    </a>

    <a href="#" class="nav-item">
      <span class="nav-icon"></span>
      <span>Settings</span>
    </a>

  </nav>
</aside>

    
    <main class="main-content">
      <div class="page-header">
        <h1>Dashboard Overview</h1>
        <p>A quick overview of your business performance.</p>
      </div>

      <section class="cards-grid">

        <div class="card">
          <div class="card-label">Total Users</div>
          <div class="card-value">12,480</div>
        </div>

        <div class="card">
          <div class="card-label">Total Sales</div>
          <div class="card-value">1,245</div>
          <div class="card-growth">▲ +12.6%</div>
        </div>

        <!-- Card 3: Revenue -->
        <div class="card">
          <div class="icon-badge badge-green">₹</div>
          <div class="card-label">Revenue</div>
          <div class="card-value">₹8,42,000</div>
          <div class="card-growth">▲ +15.2%</div>
        </div>

        <!-- Card 4: Orders -->
        <div class="card">
          <div class="icon-badge badge-orange">📦</div>
          <div class="card-label">Orders</div>
          <div class="card-value">3,920</div>
          <div class="card-growth">▲ +6.3%</div>
        </div>

      </section>
    </main>

  </div>

</body>
</html>
